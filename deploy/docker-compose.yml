services:
  gateway:
    build: haproxy
    container_name: gateway
    ports:
      - '80:80'
    volumes:
      - './haproxy/gateway.cfg:/usr/local/etc/haproxy/haproxy.cfg:r'
    networks:
      - main

  green_nginx:
    image: nginx:alpine
    container_name: greennginx
    volumes:
      - './nginx/green.conf:/etc/nginx/conf.d/default.conf:r'
      - './releases/green:/var/www/html:delegated'
    networks:
      main:
        ipv4_address: 172.20.0.10
    depends_on:
      - green
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/" ]
      interval: 5s
      timeout: 10s
      retries: 3

  blue_nginx:
    image: nginx:alpine
    container_name: bluenginx
    volumes:
      - './nginx/blue.conf:/etc/nginx/conf.d/default.conf:r'
      - './releases/blue:/var/www/html:delegated'
    networks:
      main:
        ipv4_address: 172.20.0.11
    depends_on:
      - blue
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/" ]
      interval: 5s
      timeout: 10s
      retries: 3

  blue:
    image: jkaninda/laravel-php-fpm:latest
    container_name: blue
    restart: unless-stopped
    user: www-data # For production
    environment:
      COLOR: blue
    volumes:
      - ./releases/blue:/var/www/html:delegated
      - ./releases/shared/.env:/var/www/html/.env:r
    networks:
      main:
        ipv4_address: 172.20.0.20

  green:
    image: jkaninda/laravel-php-fpm:latest
    container_name: green
    restart: unless-stopped
    environment:
      COLOR: green
    user: www-data # For production
    volumes:
      - ./releases/green:/var/www/html:delegated
      - ./releases/shared/.env:/var/www/html/.env:r
    networks:
      main:
        ipv4_address: 172.20.0.21

  test:
    image: jkaninda/laravel-php-fpm:latest
    container_name: test
    restart: unless-stopped
    depends_on:
      test_mysql:
        condition: service_healthy
    volumes:
      - ./releases/test:/var/www/html
      - ./releases/shared/.env.testing:/var/www/html/.env.testing:r

  test_mysql:
    image: mysql/mysql-server:8.0
    container_name: test_mysql
    environment:
      MYSQL_DATABASE: testing
      MYSQL_USER: testing
      MYSQL_PASSWORD: testing
      MYSQL_ROOT_PASSWORD: testing
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10

  mysql:
    image: mysql/mysql-server:8.0
    container_name: mysql
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_USER: prod
      MYSQL_PASSWORD: prod
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - ./mysql:/var/lib/mysql
    networks:
      - main

networks:
  main:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
