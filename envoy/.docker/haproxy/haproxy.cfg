global
  stats socket /sock/admin.sock user haproxy group haproxy mode 660 level admin
  server-state-file /tmp/balance-state-file
  log stdout format raw local0 info

defaults
  mode                        http
  log                         global
  timeout connect             5s
  timeout http-request        15s
  timeout queue               30s
  timeout client              300s
  timeout server              300s
  load-server-state-from-file global


frontend  fe_main
  bind :80
  default_backend blue_green

backend blue_green
  mode http

  option httpchk GET /up
  http-check expect status 200

  balance       sticky
  # green nginx
  server green	172.16.1.10:80 check inter 1s fall 2 rise 1
  # blue nginx
  server blue	172.16.1.11:80 check inter 1s fall 2 rise 1
