services:
  balance:
    container_name: otus-app-balance
    build:
      context: .docker/haproxy
    ports:
      - 8080:80
    volumes:
      - './.docker/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro'
    networks:
      - sail

  green_nginx: &nginx
    container_name: otus-app-green-nginx
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    build:
      context: '.docker/nginx'
    links:
      - green_app
      - db
    restart: on-failure
    volumes:
      - './.docker/nginx/green.conf:/etc/nginx/conf.d/default.conf:ro'
      - './releases/green:/var/www/html:ro,delegated'
      - './releases/shared/storage/app:/var/www/html/storage/app'
      - './.sail/logs/nginx:/var/log/nginx'
    networks:
      sail:
        ipv4_address: 172.16.1.10

  blue_nginx: 
    <<: *nginx
    container_name: otus-app-blue-nginx
    links:
      - blue_app
      - db
    restart: on-failure
    volumes:
      - './.docker/nginx/blue.conf:/etc/nginx/conf.d/default.conf:ro'
      - './releases/blue:/var/www/html:ro,delegated'
      - './releases/shared/storage/app:/var/www/html/storage/app'
      - './.sail/logs/nginx:/var/log/nginx'
    networks:
      sail:
        ipv4_address: 172.16.1.11

  green_app: &app
    container_name: otus-app-green-app
    build:
      context: .docker/php
      args:
        WWWUSER: '${WWWUSER}'
        WWWGROUP: '${WWWGROUP}'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: on-failure
    working_dir: /var/www/html
    volumes:
      - './releases/green:/var/www/html:delegated'
      - './releases/shared/storage/app:/var/www/html/storage/app'
      - './releases/shared/.env:/var/www/html/.env:ro'
      - './.sail/logs/php:/var/log/php'
    environment:
      XDEBUG_MODE: debug
      COLOR: green
    networks:
      sail:
        ipv4_address: 172.16.1.20

  blue_app: 
    <<: *app
    container_name: otus-app-blue-app
    volumes:
      - './releases/blue:/var/www/html:delegated'
      - './releases/shared/storage/app:/var/www/html/storage/app'
      - './releases/shared/.env:/var/www/html/.env:ro'
      - './.sail/logs/php:/var/log/php'
    environment:
      XDEBUG_MODE: debug
      COLOR: blue
    networks:
      sail:
        ipv4_address: 172.16.1.21

  queue:
    <<: *app
    container_name: otus-app-queue
    command: sudo -u www-data php /var/www/html/artisan queue:work -v --timeout=300 --memory=1024
    restart: always
    networks:
      sail:
        ipv4_address: 172.16.1.30

  db:
    image: mariadb:latest
    hostname: mariadb
    extra_hosts:
      - host.docker.internal:host-gateway
    container_name: otus-app-db
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - ${DB_PORT}:3306
    volumes:
      - 'sail-db:/var/lib/mysql'
    networks:
      - sail
  redis:
    image: redis:latest
    container_name: otus-app-redis
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: on-failure
    ports:
      - 6379:6379
    volumes:
      - 'sail-redis:/data'
    networks:
      - sail

networks:
    sail:
        driver: bridge
        ipam:
          config:
            - subnet: 172.16.1.0/24

volumes:
    sail-db:
        driver: local
    sail-redis:
        driver: local
