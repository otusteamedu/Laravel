version: "3.9"

services:
  app-blue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: otus_laravel_app_blue
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    environment:
      XDEBUG_MODE: coverage
    depends_on:
      - postgres
    networks:
      - mynetwork
    user: "1000:1000"

  nginx:
    image: nginx:alpine
    container_name: otus_nginx_server
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app-blue
    networks:
      - mynetwork

  postgres:
    image: postgres:15
    container_name: otus_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - mynetwork

  memcached:
    image: memcached:latest
    container_name: otus_memcached
    ports:
      - "11211:11211"
    restart: unless-stopped
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: bridge

volumes:
  pgdata:
