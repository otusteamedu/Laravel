services:
  lara_app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: otus_laravel_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    environment:
      XDEBUG_MODE: coverage
    depends_on:
      - postgres
    networks:
      - mynetwork
    user: "1000:1000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    image: nginx:alpine
    container_name: otus_nginx_server
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - lara_app
    networks:
      - mynetwork

  postgres:
    image: postgres:15
    container_name: otus_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - mynetwork

  postgres_test:
    image: postgres:15
    container_name: otus_postgres_db_test
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TEST_DB_DATABASE}
      POSTGRES_USER: ${TEST_DB_USERNAME}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - pgdata_test:/var/lib/postgresql/data
    networks:
      - mynetwork
  
  memcached:
    image: memcached:latest
    container_name: otus_memcached
    ports:
      - "11211:11211"
    restart: unless-stopped
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: bridge

volumes:
  pgdata:
  pgdata_test:
